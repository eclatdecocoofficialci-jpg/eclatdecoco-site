<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panier | Éclat de Coco</title>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f8f3ee;
  color:#111;
}

header{
  background:white;
  padding:25px;
  text-align:center;
}

.cart{
  max-width:700px;
  margin:30px auto;
  background:white;
  padding:25px;
  border-radius:20px;
}

.item{
  border-bottom:1px solid #ddd;
  padding:15px 0;
}

.item h3{
  margin:0;
}

.total{
  font-size:1.4rem;
  font-weight:bold;
  margin-top:20px;
}

input, textarea{
  width:100%;
  padding:14px;
  margin:10px 0;
  border:1px solid #ccc;
  border-radius:10px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:15px;
  border:none;
  background:black;
  color:white;
  border-radius:30px;
  font-size:1rem;
  margin-top:15px;
  cursor:pointer;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:black;
}
</style>
</head>

<body>

<header>
<h1>Votre Panier</h1>
</header>

<div class="cart">

<div id="cartItems"></div>

<p class="total" id="total">Total : 0 FCFA</p>

<h2>Informations client</h2>

<input type="text" id="name" placeholder="Nom complet">
<input type="tel" id="phone" placeholder="Numéro de téléphone">
<textarea id="address" placeholder="Adresse de livraison"></textarea>

<p>Livraison : à partir de 2 000 FCFA selon votre commune.</p>
<p>Paiement à la livraison.</p>

<button onclick="confirmOrder()">Confirmer la commande</button>

<a href="shop.html" class="back">← Retour à la boutique</a>

</div>

<script>
emailjs.init("uXzUSZQODQlmyuGgb");

let cart = JSON.parse(localStorage.getItem("cart")) || [];
let total = 0;

function renderCart(){
  const cartItems = document.getElementById("cartItems");
  const totalEl = document.getElementById("total");

  cartItems.innerHTML = "";
  total = 0;

  if(cart.length === 0){
    cartItems.innerHTML = "<p>Votre panier est vide.</p>";
  }

  cart.forEach((item, index) => {
    total += item.price * item.quantity;

    cartItems.innerHTML += `
      <div class="item">
        <h3>${item.name}</h3>
        <p>Prix : ${item.price.toLocaleString()} FCFA</p>
        <p>Quantité : ${item.quantity}</p>
        <p>Sous-total : ${(item.price * item.quantity).toLocaleString()} FCFA</p>
        <button onclick="removeItem(${index})">Retirer</button>
      </div>
    `;
  });

  totalEl.innerText = "Total : " + total.toLocaleString() + " FCFA";
}

function removeItem(index){
  cart.splice(index, 1);
  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart();
}

function confirmOrder(){
  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const address = document.getElementById("address").value.trim();

  if(cart.length === 0){
    alert("Votre panier est vide.");
    return;
  }

  if(!name || !phone || !address){
    alert("Veuillez remplir votre nom, téléphone et adresse.");
    return;
  }

  const orderDetails = cart.map(item => {
    return `${item.name} x${item.quantity} = ${(item.price * item.quantity).toLocaleString()} FCFA`;
  }).join("\n");

  const templateParams = {
    email: "sarahajamii@icloud.com",
    customer_name: name,
    customer_phone: phone,
    customer_address: address,
    order_details: orderDetails,
    order_total: total.toLocaleString() + " FCFA",
    delivery_note: "Livraison à partir de 2 000 FCFA selon la commune. Paiement à la livraison.",
    order_id: "EDC-" + Date.now()
  };

  emailjs.send("service_buy8fox", "template_97nbk68", templateParams)
    .then(function(){
      alert("Commande confirmée. Nous vous contacterons pour la livraison.");
      localStorage.removeItem("cart");
      window.location.href = "shop.html";
    })
  .catch(function(error){
  alert("Erreur EmailJS : " + JSON.stringify(error));
  console.log("EmailJS error:", error);
});
}

renderCart();
</script>

</body>
</html>
